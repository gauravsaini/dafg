[project]
name = "dafg"
version = "0.1.0"
description = "DAFG: Dynamic Autonomous Flow Graph — agent coordination and completion-discipline framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dafg = "dafg.cli:main"
gates = "dafg.gates:main"
stop-hook = "dafg.hook:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dafg", "src/framework"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
